name: CI

on:
  push:
  pull_request:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: services/pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run --frozen ruff check
      - run: uv run --frozen ruff format --check
      - run: uv run --frozen pytest -q
      - name: SQLite ingest and export smoke test
        run: |
          uv run --frozen mtb-pipeline init-db --database ../data/ci.sqlite3
          uv run --frozen mtb-pipeline ingest --input tests/fixtures/events.json --database ../data/ci.sqlite3
          uv run --frozen mtb-pipeline export --database ../data/ci.sqlite3 --output ../data/ci-export.json

  site:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Smoke-test the built site in a headless browser
        # Runs against astro preview on the base path Pages will use. Asserts
        # theme painting and persistence, canonical/og presence, base-prefixed
        # links, the .ics downloads, and robots/sitemap/favicon.
        run: |
          npm run preview -- --port 4322 &
          npx --yes wait-on@7 http://localhost:4322/mtb-marathon-calendar/ -t 30000
          node tests/smoke.mjs http://localhost:4322/mtb-marathon-calendar/