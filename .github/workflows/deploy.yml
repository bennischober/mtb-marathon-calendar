name: Deploy site

# Publishes the static site from the committed data artifact on every push to
# main. Deliberately independent of collection: data collection stays manual
# while the pipeline is being hardened, but the site should always reflect the
# latest committed data/generated/events.json. Re-enable scheduled collection
# separately once the sources are vetted (see collect.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/site/package-lock.json

      - run: npm ci
        working-directory: apps/site

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.13"

      - name: Validate the committed data artifact
        # Deploy gates on the same validation as collection: a hand-edited or
        # stale-broken events.json must not reach the live site.
        run: |
          uv run --project services/pipeline --frozen mtb-pipeline validate \
            --input data/generated/events.json

      - run: npm run build
        working-directory: apps/site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist
          retention-days: 7

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
